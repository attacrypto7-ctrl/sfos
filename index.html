<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/Logo Kebunku.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kebunku - Sistem IoT untuk memantau dan menyiram tanaman otomatis, kapan pun dan di mana pun." />
    <meta name="theme-color" content="#F6FAF8" />
    <title>Tanamanku - Kendali Pintar untuk Perawatan Maksimal</title>

    <!-- Preconnect ke Google Fonts: mengurangi waktu tunggu font (CWV: LCP/CLS) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="image" href="/Logo Kebunku.png" />

    <script>
    (function () {
        var fullTitle = "Tanamanku - Kendali Pintar untuk Perawatan Maksimal";
        var padding = "                              ";
        var displayText = padding + fullTitle + padding;
        var pos = 0;
        var speed = 0.6;          // karakter per tick
        var visibleLen = 35;

        // Interval (bukan requestAnimationFrame per-frame) agar tidak
        // menghabiskan CPU/GPU terus-menerus → INP & baterai lebih baik.
        // Update title hanya ~5x/detik, cukup untuk efek scroll halus.
        function update() {
            var start = Math.floor(pos);
            var snippet = displayText.substring(start, start + visibleLen);
            while (snippet.length < visibleLen) snippet += " ";
            document.title = snippet;
            pos += speed;
            if (pos > displayText.length - visibleLen) pos = 0;
        }

        // Jeda saat tab tidak terlihat (visibilitychange) → hemat CPU
        document.addEventListener('visibilitychange', function () {
            if (document.hidden) { clearInterval(timerId); }
            else { timerId = setInterval(update, 200); }
        });
        var timerId = setInterval(update, 200);
    })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
