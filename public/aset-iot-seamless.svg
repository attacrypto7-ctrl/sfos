<svg viewBox="0 0 900 260" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <linearGradient id="sLeafA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stopColor="rgba(159,225,203,0.45)" />
      <stop offset="1" stopColor="rgba(77,217,168,0.12)" />
    </linearGradient>
    <linearGradient id="sLeafB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stopColor="rgba(255,255,255,0.38)" />
      <stop offset="1" stopColor="rgba(255,255,255,0.07)" />
